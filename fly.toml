# fly.toml app configuration file generated for sableshedwig on 2026-04-22T09:11:30+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sableshedwig'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    OPENCLAW_DOCKER_APT_PACKAGES = "tmux jq ffmpeg yt-dlp"
    OPENCLAW_INSTALL_SKILL_DEPS = "1"

[env]
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=1536'
  OPENCLAW_PREFER_PNPM = '1'
  OPENCLAW_STATE_DIR = '/data'

[processes]
  app = "/app/fly-root-init.sh"

[[mounts]]
  source = 'openclaw_data'
  destination = '/data'

# Gateway / Control UI ingress (public HTTPS on 443 -> internal 3000).
# Expressed as [[services]] (not [http_service]) so a second service can share
# this fly.toml for the voice-call webhook below.
[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

# voice-call webhook ingress. Twilio cannot reach the gateway's 443->3000 path
# (separate HTTP listener), so expose the plugin's serve.port (3334) on external
# 8443 with TLS. Shared IPv4 routes non-443 TLS ports by SNI (sableshedwig.fly.dev),
# so no dedicated IP is needed. Twilio webhook URL: https://sableshedwig.fly.dev:8443/voice/webhook
[[services]]
  internal_port = 3334
  protocol = "tcp"
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
  memory_mb = 2048
