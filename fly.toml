# fly.toml app configuration file generated for sableshedwig on 2026-04-22T09:11:30+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sableshedwig'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    OPENCLAW_DOCKER_APT_PACKAGES = "tmux jq ffmpeg yt-dlp"
    OPENCLAW_INSTALL_SKILL_DEPS = "1"

[env]
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=1536'
  OPENCLAW_PREFER_PNPM = '1'
  OPENCLAW_STATE_DIR = '/data'

[processes]
  app = "/app/fly-root-init.sh"

[[mounts]]
  source = 'openclaw_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'performance-1x'
  memory = '2gb'
  memory_mb = 2048
