name: Hedwig brief watchdog

# Dead-man's switch for Hedwig brief delivery.
# Runs externally (GH Actions) so it fires even if the Fly VM, cron scheduler,
# or Telegram delivery path is dead — scenarios the in-VM brief-sentinel.mjs
# cannot detect.
#
# Checks: did the brief's own scheduled occurrence run AND deliver? (Anchored to
# the expected fire time, not a rolling window — GH runners fire 60-260 min late.)
# Alert path: direct Telegram Bot API call from GH Actions runner (not via VM).
#
# Required repo secrets:
#   FLY_API_TOKEN      — already used by build-hedwig-image.yml
#   TELEGRAM_BOT_TOKEN — same value as the fly secret on sableshedwig
#   HEDWIG_OWNER_CHAT_ID — Telegram user id of the owner (required; no literal in this public fork)

on:
  schedule:
    # 30 min after morning brief (07:00 JST = 22:00 UTC)
    - cron: '30 22 * * *'
    # 30 min after evening brief (21:00 JST = 12:00 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      check_both:
        description: 'Check both briefs regardless of time'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check brief delivery and alert if silent
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HEDWIG_OWNER_CHAT_ID: ${{ secrets.HEDWIG_OWNER_CHAT_ID }}
          CHECK_BOTH: ${{ inputs.check_both || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          TMP=$(mktemp)
          SSH_OK=1
          flyctl ssh console -a sableshedwig \
            -C "su node -s /bin/sh -c 'HOME=/home/node OPENCLAW_GATEWAY_PORT=3000 openclaw cron list --json 2>/dev/null'" \
            > "$TMP" 2>&1 || SSH_OK=0

          SSH_OK=$SSH_OK CRON_LIST_FILE=$TMP python3 scripts/hedwig-watchdog-check.py

      - name: Summary
        if: always()
        run: echo "Watchdog run $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
