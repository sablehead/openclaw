name: Hedwig brief watchdog

# Dead-man's switch for Hedwig brief delivery.
# Runs externally (GH Actions) so it fires even if the Fly VM, cron scheduler,
# or Telegram delivery path is dead — scenarios the in-VM brief-sentinel.mjs
# cannot detect.
#
# Checks: did the expected brief run within the last 90 minutes AND deliver?
# Alert path: direct Telegram Bot API call from GH Actions runner (not via VM).
#
# Required repo secrets:
#   FLY_API_TOKEN      — already used by build-hedwig-image.yml
#   TELEGRAM_BOT_TOKEN — same value as the fly secret on sableshedwig
#   HEDWIG_OWNER_CHAT_ID — Telegram user id of the owner (optional; has fallback)

on:
  schedule:
    # 30 min after morning brief (07:00 JST = 22:00 UTC)
    - cron: '30 22 * * *'
    # 30 min after evening brief (21:00 JST = 12:00 UTC)
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      check_both:
        description: 'Check both briefs regardless of time'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check brief delivery and alert if silent
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HEDWIG_OWNER_CHAT_ID: ${{ secrets.HEDWIG_OWNER_CHAT_ID }}
          CHECK_BOTH: ${{ inputs.check_both || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          TMP=$(mktemp)
          SSH_OK=1
          flyctl ssh console -a sableshedwig \
            -C "su node -s /bin/sh -c 'HOME=/home/node OPENCLAW_GATEWAY_PORT=3000 openclaw cron list --json 2>/dev/null'" \
            > "$TMP" 2>&1 || SSH_OK=0

          SSH_OK=$SSH_OK \
          CRON_LIST_FILE=$TMP \
          python3 << 'PYEOF'
import json, os, re, sys, urllib.request, time, datetime

MORNING_ID = "b0f26c87-d537-44cb-943f-ca3575c14d89"
EVENING_ID = "5ae4aecb-2ebd-44ad-b766-8f37324f1245"
BRIEFS = [("朝ブリーフ", MORNING_ID), ("夕ブリーフ", EVENING_ID)]
WINDOW_MS = 90 * 60 * 1000

tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
chat_id = os.environ.get("HEDWIG_OWNER_CHAT_ID") or "8709180805"
run_url = os.environ.get("RUN_URL", "")


def send_alert(text):
    if not tg_token:
        print(f"[no-tg-secret] ALERT: {text[:120]}", file=sys.stderr)
        return
    body = json.dumps({"chat_id": chat_id, "text": text}).encode()
    req = urllib.request.Request(
        f"https://api.telegram.org/bot{tg_token}/sendMessage",
        data=body,
        headers={"Content-Type": "application/json"},
    )
    try:
        urllib.request.urlopen(req, timeout=10)
        print("Alert sent via Telegram")
    except Exception as e:
        print(f"TG send failed: {e}", file=sys.stderr)


if os.environ.get("SSH_OK") == "0":
    send_alert(
        f"🦉🚨 Hedwig dead-man's switch: flyctl SSH 接続失敗。VM が応答していません。\n\n{run_url}"
    )
    sys.exit(0)

raw = open(os.environ["CRON_LIST_FILE"]).read()
now_ms = int(time.time() * 1000)
cutoff_ms = now_ms - WINDOW_MS

# Which brief to check based on JST hour (or explicit override)
hour_jst = (datetime.datetime.utcnow().hour + 9) % 24
check_both = os.environ.get("CHECK_BOTH", "false").lower() == "true"
if check_both:
    to_check = BRIEFS
elif 7 <= hour_jst < 10:
    to_check = [("朝ブリーフ", MORNING_ID)]
elif 21 <= hour_jst or hour_jst < 1:
    to_check = [("夕ブリーフ", EVENING_ID)]
else:
    to_check = BRIEFS  # dispatch outside expected windows: check both

m = re.search(r'\{[\s\S]*\}', raw)
jobs = []
if m:
    try:
        jobs = json.loads(m.group()).get("jobs", [])
    except Exception:
        pass

problems = []
for label, jid in to_check:
    job = next((j for j in jobs if j["id"] == jid), None)
    if not job:
        problems.append(f"• {label}: cronジョブ不明 (ID: {jid})")
        continue
    state = job.get("state", {})
    last_run = state.get("lastRunAtMs") or 0
    delivered = state.get("lastDelivered") is True
    if last_run < cutoff_ms:
        age = (now_ms - last_run) // 60000 if last_run else "不明"
        problems.append(f"• {label}: 90分以内に実行なし（最終 {age}分前）")
    elif not delivered:
        problems.append(f"• {label}: 実行済みだが未配信")
    else:
        age = (now_ms - last_run) // 60000
        print(f"{label}: OK（{age}分前に配信済み）")

if problems:
    msg = (
        "🦉🚨 Hedwig dead-man's switch: ブリーフ未配信を検知\n\n"
        + "\n".join(problems)
        + f"\n\n詳細: {run_url}"
    )
    print(f"Problems detected: {problems}")
    send_alert(msg)
else:
    print("All checked briefs delivered OK")
PYEOF

      - name: Summary
        if: always()
        run: |
          echo "Watchdog run: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
