name: Hedwig mail alert

# Event-driven push pilot: polls hedwig-cal GET /alerts for important new mail and
# sends a direct Telegram DM (the same alternate path the brief watchdog uses).
# Runs externally on GH Actions so it needs no in-VM LLM cron (zero Gemini cost);
# dedup is server-side via the /alerts cursor, so this job just forwards results.
#
# A/B partner of the time-based morning/evening briefs: we keep both running and
# compare reply rates to decide whether event-driven beats fixed-time delivery.
#
# Required repo secrets:
#   TELEGRAM_BOT_TOKEN   — same value as the fly secret on sableshedwig
#   HEDWIG_OWNER_CHAT_ID — owner's Telegram user id (required; no literal in this public fork)
#   HEDWIG_CAL_BASE      — hedwig-cal base URL (kept out of the public fork)
#   HEDWIG_CAL_TOKEN     — hedwig-cal proxy token (sent as Bearer)

on:
  schedule:
    # Every 30 min, waking hours only: 07:00–23:30 JST == 22:00–14:30 UTC. Keeps
    # the run count under the private free-minutes budget and mutes night pings.
    - cron: '*/30 22,23 * * *'
    - cron: '*/30 0-14 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Never overlap polls: an overlap could read the cursor mid-advance. Serialise.
concurrency:
  group: hedwig-mail-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Poll important mail and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HEDWIG_OWNER_CHAT_ID: ${{ secrets.HEDWIG_OWNER_CHAT_ID }}
          HEDWIG_CAL_BASE: ${{ secrets.HEDWIG_CAL_BASE }}
          HEDWIG_CAL_TOKEN: ${{ secrets.HEDWIG_CAL_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/hedwig-mail-alert.py

      - name: Summary
        if: always()
        run: echo "Mail alert poll $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
